[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liberdus-discord-moderator"
version = "0.6.1"
description = "Standalone Discord moderation service with guided setup and optional Hermes integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
discord = ["discord.py==2.7.1", "aiohttp==3.14.3"]
migration = ["PyYAML==6.0.3"]

[project.scripts]
liberdus-moderator = "liberdus_moderator.cli:main"

[tool.setuptools.packages.find]
include = ["liberdus_moderator*"]
