[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liberdus-discord-moderator"
version = "0.5.3"
description = "Report-only moderation core and optional Hermes Discord pilot plugin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
liberdus-moderator = "liberdus_moderator.cli:main"

[tool.setuptools.packages.find]
include = ["liberdus_moderator*"]
