name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate and simulate
        run: |
          python -m liberdus_moderator validate --config examples/config.toml
          python -m liberdus_moderator simulate --config examples/config.toml --events examples/messages.jsonl
      - name: Replay and inspect local state
        run: |
          python -m liberdus_moderator replay --config examples/config.toml --events examples/messages.jsonl --database "${RUNNER_TEMP}/moderation.sqlite3"
          python -m liberdus_moderator incidents --config examples/config.toml --database "${RUNNER_TEMP}/moderation.sqlite3"
          python -m liberdus_moderator reports --config examples/config.toml --database "${RUNNER_TEMP}/moderation.sqlite3"
          python -m liberdus_moderator command --config examples/config.toml --request examples/command.json --database "${RUNNER_TEMP}/moderation.sqlite3"
